<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Plantester</title>

    <style>
        :root {
            --navy: #0f172a;
            --royal-blue: #2563eb;
            --royal-blue-dark: #1d4ed8;
            --red: #dc2626;
            --red-dark: #b91c1c;
            --background: #f3f4f6;
            --border: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family: Arial, sans-serif;

            background-color: var(--background);

            overflow: hidden;
        }

        header {
            height: 60px;

            padding: 0 16px 0 24px;

            background-color: var(--navy);
            color: white;

            display: grid;

            grid-template-columns:
                minmax(180px, 1fr)
                minmax(200px, 2fr)
                minmax(180px, 1fr);

            align-items: center;

            gap: 15px;
        }

        header h1 {
            margin: 0;

            color: white;

            font-size: 24px;
            font-weight: bold;
        }

        #planName {
            width: 100%;

            color: white;

            font-size: 17px;
            font-weight: normal;

            text-align: center;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #actions {
            justify-self: end;

            display: flex;
            align-items: center;

            gap: 10px;
        }

        button {
            height: 38px;

            padding: 0 18px;

            border: none;
            border-radius: 7px;

            color: white;

            font-family: Arial, sans-serif;
            font-size: 15px;

            cursor: pointer;
        }

        #chooseButton {
            background-color: var(--royal-blue);
        }

        #chooseButton:hover {
            background-color: var(--royal-blue-dark);
        }

        #testButton {
            display: none;

            align-items: center;

            gap: 8px;

            background-color: var(--royal-blue);
        }

        #testButton:hover {
            background-color: var(--royal-blue-dark);
        }

        #testButton:disabled {
            opacity: 0.65;
            cursor: progress;
        }

        #testIcon {
            width: 23px;
            height: 23px;

            display: inline-flex;

            justify-content: center;
            align-items: center;

            border: 2px solid white;
            border-radius: 50%;

            font-size: 14px;
            font-weight: bold;
        }

        #closeButton {
            display: none;

            width: 38px;
            height: 38px;

            padding: 0;

            justify-content: center;
            align-items: center;

            background-color: var(--red);

            font-size: 28px;
            font-weight: normal;

            line-height: 1;
        }

        #closeButton:hover {
            background-color: var(--red-dark);
        }

        #fileInput {
            display: none;
        }

        main {
            height: calc(100vh - 60px);

            padding: 18px;
        }

        #dropzone {
            width: 100%;
            height: 100%;

            position: relative;

            display: flex;

            justify-content: center;
            align-items: center;

            border: 4px dashed var(--border);
            border-radius: 14px;

            background-color: white;

            overflow: auto;

            transition:
                border-color 0.2s,
                background-color 0.2s;
        }

        #dropzone.dragover {
            border-color: var(--royal-blue);

            background-color: #eff6ff;
        }

        #dropzone.pdfLoaded {
            border-style: solid;
            border-width: 1px;
            border-color: #cbd5e1;

            align-items: flex-start;
        }

        #message {
            padding: 30px;

            color: #64748b;

            font-size: 22px;
            line-height: 1.6;

            text-align: center;
        }

        #message strong {
            color: var(--navy);
        }

        #pdfCanvas {
            display: none;

            max-width: none;

            background-color: white;

            box-shadow:
                0 2px 16px
                rgba(0, 0, 0, 0.18);
        }

        #status {
            display: none;

            position: fixed;

            top: 78px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 10;

            min-width: 240px;

            padding: 10px 16px;

            border-radius: 7px;

            background-color:
                rgba(15, 23, 42, 0.94);

            color: white;

            font-size: 14px;

            text-align: center;

            pointer-events: none;
        }

        #ocrPreview {
            display: none;
        }

        @media (max-width: 850px) {
            header {
                grid-template-columns:
                    auto
                    1fr
                    auto;
            }

            #planName {
                font-size: 14px;
            }

            button {
                padding: 0 12px;
            }

            #testButtonText {
                display: none;
            }
        }
    </style>
</head>

<body>

    <header>

        <h1>Plantester</h1>

        <div
            id="planName"
            title=""
        ></div>

        <div id="actions">

            <button
                id="testButton"
                type="button"
                title="Plankopf unten rechts prüfen"
            >
                <span id="testIcon">✓</span>

                <span id="testButtonText">
                    Plantester
                </span>
            </button>

            <button
                id="chooseButton"
                type="button"
            >
                PDF auswählen
            </button>

            <button
                id="closeButton"
                type="button"
                title="PDF schliessen"
                aria-label="PDF schliessen"
            >
                ×
            </button>

            <input
                id="fileInput"
                type="file"
                accept="application/pdf,.pdf"
            >

        </div>

    </header>

    <main>

        <div id="dropzone">

            <div id="message">

                <strong>
                    PDF-Plan hier hineinziehen
                </strong>

                <br>

                oder oben auf „PDF auswählen“ klicken

            </div>

            <canvas id="pdfCanvas"></canvas>

        </div>

    </main>

    <div id="status"></div>

    <canvas id="ocrPreview"></canvas>
