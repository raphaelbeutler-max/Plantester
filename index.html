<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Plantester</title>

    <style>
        :root {
            --dunkelblau: #0f172a;
            --koenigsblau: #2563eb;
            --koenigsblau-dunkel: #1d4ed8;
            --rot: #dc2626;
            --rot-dunkel: #b91c1c;
            --hintergrund: #f3f4f6;
            --rahmen: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family: Arial, sans-serif;

            background-color: var(--hintergrund);

            overflow: hidden;
        }

        header {
            height: 60px;

            padding: 0 16px 0 24px;

            display: grid;

            grid-template-columns:
                minmax(180px, 1fr)
                minmax(250px, 2fr)
                minmax(280px, 1fr);

            align-items: center;

            gap: 15px;

            background-color: var(--dunkelblau);
            color: white;
        }

        header h1 {
            margin: 0;

            color: white;

            font-size: 24px;
            font-weight: bold;
        }

        #planName {
            width: 100%;

            color: white;

            font-size: 17px;
            font-weight: normal;

            text-align: center;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #actions {
            justify-self: end;

            display: flex;
            align-items: center;

            gap: 10px;
        }

        button {
            height: 38px;

            padding: 0 18px;

            border: none;
            border-radius: 7px;

            color: white;

            font-family: Arial, sans-serif;
            font-size: 15px;

            cursor: pointer;
        }

        #chooseButton,
        #testButton {
            background-color: var(--koenigsblau);
        }

        #chooseButton:hover,
        #testButton:hover {
            background-color: var(--koenigsblau-dunkel);
        }

        #testButton {
            display: none;

            align-items: center;

            gap: 9px;
        }

        #testButton:disabled {
            opacity: 0.65;
            cursor: progress;
        }

        #testIcon {
            width: 24px;
            height: 24px;

            display: inline-flex;

            justify-content: center;
            align-items: center;

            border: 2px solid white;
            border-radius: 50%;

            color: white;

            font-size: 15px;
            font-weight: bold;
        }

        #closeButton {
            display: none;

            width: 38px;
            height: 38px;

            padding: 0;

            justify-content: center;
            align-items: center;

            background-color: var(--rot);

            color: white;

            font-size: 28px;
            font-weight: normal;

            line-height: 1;
        }

        #closeButton:hover {
            background-color: var(--rot-dunkel);
        }

        #fileInput {
            display: none;
        }

        main {
            height: calc(100vh - 60px);

            padding: 18px;
        }

        #dropzone {
            width: 100%;
            height: 100%;

            position: relative;

            display: flex;

            justify-content: center;
            align-items: center;

            border: 4px dashed var(--rahmen);
            border-radius: 14px;

            background-color: white;

            overflow: auto;

            transition:
                border-color 0.2s,
                background-color 0.2s;
        }

        #dropzone.dragover {
            border-color: var(--koenigsblau);

            background-color: #eff6ff;
        }

        #dropzone.pdfLoaded {
            align-items: flex-start;

            border: 1px solid #cbd5e1;
        }

        #message {
            padding: 30px;

            color: #64748b;

            font-size: 22px;
            line-height: 1.6;

            text-align: center;
        }

        #message strong {
            color: var(--dunkelblau);
        }

        #pdfCanvas {
            display: none;

            background-color: white;

            box-shadow:
                0 2px 16px
                rgba(0, 0, 0, 0.18);
        }

        #status {
            display: none;

            position: fixed;

            top: 78px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 100;

            min-width: 280px;
            max-width: 700px;

            padding: 11px 17px;

            border-radius: 7px;

            background-color:
                rgba(15, 23, 42, 0.95);

            color: white;

            font-size: 14px;

            text-align: center;

            pointer-events: none;
        }

        #status.success {
            background-color:
                rgba(30, 64, 175, 0.96);
        }

        #status.error {
            background-color:
                rgba(185, 28, 28, 0.96);
        }

        @media (max-width: 850px) {
            header {
                grid-template-columns:
                    auto
                    1fr
                    auto;
            }

            #planName {
                font-size: 14px;
            }

            button {
                padding: 0 12px;
            }

            #testButtonText {
                display: none;
            }
        }
    </style>
</head>

<body>

    <header>

        <h1>Plantester</h1>

        <div
            id="planName"
            title=""
        ></div>

        <div id="actions">

            <button
                id="testButton"
                type="button"
                title="Planname im Plankopf prüfen"
            >
                <span id="testIcon">✓</span>

                <span id="testButtonText">
                    Plantester
                </span>
            </button>

            <button
                id="chooseButton"
                type="button"
            >
                PDF auswählen
            </button>

            <button
                id="closeButton"
                type="button"
                title="PDF schliessen"
                aria-label="PDF schliessen"
            >
                ×
            </button>

            <input
                id="fileInput"
                type="file"
                accept="application/pdf,.pdf"
            >

        </div>

    </header>

    <main>

        <div id="dropzone">

            <div id="message">

                <strong>
                    PDF-Plan hier hineinziehen
                </strong>

                <br>

                oder oben auf „PDF auswählen“ klicken

            </div>

            <canvas id="pdfCanvas"></canvas>

        </div>

    </main>

    <div id="status"></div>

    <script type="module">

        import * as pdfjsLib from
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

        const dropzone =
            document.getElementById("dropzone");

        const message =
            document.getElementById("message");

        const pdfCanvas =
            document.getElementById("pdfCanvas");

        const pdfContext =
            pdfCanvas.getContext("2d");

        const chooseButton =
            document.getElementById("chooseButton");

        const testButton =
            document.getElementById("testButton");

        const closeButton =
            document.getElementById("closeButton");

        const fileInput =
            document.getElementById("fileInput");

        const planName =
            document.getElementById("planName");

        const status =
            document.getElementById("status");

        let pdfDocument = null;
        let firstPage = null;
        let extractionViewport = null;
        let statusTimer = null;

        /*
            FESTGELEGTER LESEBEREICH DES PLANKOPFS

            X_MIN = 0.05:
            Der Bereich beginnt bei 5 Prozent
            der Planbreite.

            X_MAX = 0.70:
            Der Bereich endet bei 70 Prozent
            der Planbreite.

            Damit endet die Suche ungefähr beim
            Zentrum des Nordpfeils.

            Die Höhenangaben und Bauvorhaben-Daten
            rechts davon werden nicht gelesen.

            Y_MIN = 0.68:
            Es werden nur die unteren 32 Prozent
            des Plans durchsucht.
        */

        const X_MIN = 0.05;
        const X_MAX = 0.70;
        const Y_MIN = 0.68;
        const Y_MAX = 0.99;

        chooseButton.addEventListener(
            "click",
            function () {
                fileInput.click();
            }
        );

        fileInput.addEventListener(
            "change",
            function () {
                if (fileInput.files.length > 0) {
                    loadPdf(
                        fileInput.files[0]
                    );
                }
            }
        );

        closeButton.addEventListener(
            "click",
            resetViewer
        );

        testButton.addEventListener(
            "click",
            detectPlanName
        );

        dropzone.addEventListener(
            "dragenter",
            handleDragOver
        );

        dropzone.addEventListener(
            "dragover",
            handleDragOver
        );

        dropzone.addEventListener(
            "dragleave",
            function (event) {
                event.preventDefault();

                dropzone.classList.remove(
                    "dragover"
                );
            }
        );

        dropzone.addEventListener(
            "drop",
            function (event) {
                event.preventDefault();

                dropzone.classList.remove(
                    "dragover"
                );

                const file =
                    event.dataTransfer.files[0];

                if (file) {
                    loadPdf(file);
                }
            }
        );

        function handleDragOver(event) {
            event.preventDefault();

            dropzone.classList.add(
                "dragover"
            );
        }

        function showStatus(
            text,
            type = ""
        ) {
            clearTimeout(statusTimer);

            status.textContent = text;

            status.className = type;

            status.style.display =
                "block";
        }

        function hideStatus() {
            clearTimeout(statusTimer);

            status.style.display =
                "none";

            status.className = "";
        }

        function hideStatusAfterDelay() {
            clearTimeout(statusTimer);

            statusTimer = setTimeout(
                function () {
                    hideStatus();
                },
                2500
            );
        }

        async function loadPdf(file) {

            const isPdf =
                file.type ===
                "application/pdf" ||
                file.name
                    .toLowerCase()
                    .endsWith(".pdf");

            if (!isPdf) {
                showStatus(
                    "Bitte eine PDF-Datei auswählen.",
                    "error"
                );

                hideStatusAfterDelay();

                return;
            }

            try {
                showStatus(
                    "PDF wird geladen ..."
                );

                const fileBuffer =
                    await file.arrayBuffer();

                const pdfData =
                    new Uint8Array(
                        fileBuffer
                    );

                pdfDocument =
                    await pdfjsLib
                        .getDocument({
                            data: pdfData
                        })
                        .promise;

                firstPage =
                    await pdfDocument.getPage(1);

                const baseViewport =
                    firstPage.getViewport({
                        scale: 1
                    });

                extractionViewport =
                    baseViewport;

                const availableWidth =
                    Math.max(
                        500,
                        dropzone.clientWidth - 30
                    );

                const availableHeight =
                    Math.max(
                        400,
                        dropzone.clientHeight - 30
                    );

                const fitScale =
                    Math.min(
                        availableWidth /
                        baseViewport.width,

                        availableHeight /
                        baseViewport.height
                    );

                const outputScale =
                    Math.max(
                        1,
                        window.devicePixelRatio
                    );

                const renderViewport =
                    firstPage.getViewport({
                        scale:
                            fitScale *
                            outputScale
                    });

                pdfCanvas.width =
                    Math.floor(
                        renderViewport.width
                    );

                pdfCanvas.height =
                    Math.floor(
                        renderViewport.height
                    );

                pdfCanvas.style.width =
                    Math.floor(
                        renderViewport.width /
                        outputScale
                    ) + "px";

                pdfCanvas.style.height =
                    Math.floor(
                        renderViewport.height /
                        outputScale
                    ) + "px";

                pdfContext.clearRect(
                    0,
                    0,
                    pdfCanvas.width,
                    pdfCanvas.height
                );

                await firstPage.render({
                    canvasContext:
                        pdfContext,

                    viewport:
                        renderViewport
                }).promise;

                message.style.display =
                    "none";

                pdfCanvas.style.display =
                    "block";

                dropzone.classList.add(
                    "pdfLoaded"
                );

                chooseButton.style.display =
                    "none";

                testButton.style.display =
                    "flex";

                closeButton.style.display =
                    "flex";

                planName.textContent =
                    "";

                planName.title =
                    "";

                hideStatus();

            } catch (error) {
                console.error(error);

                showStatus(
                    "Die PDF konnte nicht geöffnet werden.",
                    "error"
                );

                hideStatusAfterDelay();
            }
        }

        async function detectPlanName() {

            if (
                !firstPage ||
                !extractionViewport
            ) {
                return;
            }

            testButton.disabled = true;

            planName.textContent = "";

            planName.title = "";

            try {
                showStatus(
                    "Planname wird gesucht ..."
                );

                const textContent =
                    await firstPage.getTextContent();

                if (
                    !textContent.items ||
                    textContent.items.length === 0
                ) {
                    showNoTextResult();

                    return;
                }

                const allTextItems =
                    createTextItems(
                        textContent
                    );

                const titleBlockItems =
                    getTitleBlockItems(
                        allTextItems
                    );

                if (
                    titleBlockItems.length === 0
                ) {
                    showNoTextResult();

                    return;
                }

                const lines =
                    groupItemsIntoLines(
                        titleBlockItems
                    );

                if (
                    lines.length === 0
                ) {
                    showNoTextResult();

                    return;
                }

                const result =
                    findTitleCombination(
                        lines,
                        textContent.styles
                    );

                if (
                    !result ||
                    !result.fullTitle
                ) {
                    showNoTextResult();

                    return;
                }

                planName.textContent =
                    result.fullTitle;

                planName.title =
                    createDebugTitle(
                        lines,
                        result
                    );

                showStatus(
                    "Planname erkannt",
                    "success"
                );

                hideStatusAfterDelay();

            } catch (error) {
                console.error(
                    "Plantester:",
                    error
                );

                planName.textContent =
                    "Erkennung nicht möglich";

                planName.title =
                    error.message || "";

                showStatus(
                    "PDF-Text konnte nicht ausgewertet werden.",
                    "error"
                );

                hideStatusAfterDelay();

            } finally {
                testButton.disabled =
                    false;
            }
        }

        function createTextItems(
            textContent
        ) {
            const items = [];

            for (
                const rawItem
                of textContent.items
            ) {
                const text =
                    cleanText(
                        rawItem.str
                    );

                if (
                    !text ||
                    text.length < 2
                ) {
                    continue;
                }

                const transformed =
                    pdfjsLib.Util.transform(
                        extractionViewport.transform,
                        rawItem.transform
                    );

                const x =
                    transformed[4];

                const y =
                    transformed[5];

                const transformSize =
                    Math.sqrt(
                        rawItem.transform[2] *
                        rawItem.transform[2] +
                        rawItem.transform[3] *
                        rawItem.transform[3]
                    );

                const fontSize =
                    Math.max(
                        Number(
                            rawItem.height
                        ) || 0,

                        transformSize || 0
                    );

                items.push({
                    text: text,

                    x: x,

                    y: y,

                    width:
                        Number(
                            rawItem.width
                        ) || 0,

                    fontSize:
                        fontSize,

                    fontName:
                        rawItem.fontName || ""
                });
            }

            return items;
        }

        function getTitleBlockItems(
            items
        ) {
            const minimumX =
                extractionViewport.width *
                X_MIN;

            const maximumX =
                extractionViewport.width *
                X_MAX;

            const minimumY =
                extractionViewport.height *
                Y_MIN;

            const maximumY =
                extractionViewport.height *
                Y_MAX;

            return items.filter(
                function (item) {
                    return (
                        item.x >= minimumX &&
                        item.x <= maximumX &&
                        item.y >= minimumY &&
                        item.y <= maximumY
                    );
                }
            );
        }

        function groupItemsIntoLines(
            items
        ) {
            const sortedItems =
                [...items].sort(
                    function (a, b) {
                        const yDifference =
                            a.y - b.y;

                        if (
                            Math.abs(
                                yDifference
                            ) <
                            Math.max(
                                a.fontSize,
                                b.fontSize,
                                5
                            ) *
                            0.55
                        ) {
                            return a.x - b.x;
                        }

                        return yDifference;
                    }
                );

            const rows = [];

            for (
                const item
                of sortedItems
            ) {
                let matchingRow = null;

                for (
                    const row
                    of rows
                ) {
                    const tolerance =
                        Math.max(
                            row.maxFontSize,
                            item.fontSize,
                            5
                        ) *
                        0.55;

                    if (
                        Math.abs(
                            row.y - item.y
                        ) <= tolerance
                    ) {
                        matchingRow = row;

                        break;
                    }
                }

                if (matchingRow) {
                    matchingRow.items.push(
                        item
                    );

                    matchingRow.maxFontSize =
                        Math.max(
                            matchingRow.maxFontSize,
                            item.fontSize
                        );

                    matchingRow.minimumX =
                        Math.min(
                            matchingRow.minimumX,
                            item.x
                        );

                    matchingRow.maximumX =
                        Math.max(
                            matchingRow.maximumX,
                            item.x
                        );
                } else {
                    rows.push({
                        y: item.y,

                        maxFontSize:
                            item.fontSize,

                        minimumX:
                            item.x,

                        maximumX:
                            item.x,

                        items: [item]
                    });
                }
            }

            return rows
                .map(
                    function (row) {
                        row.items.sort(
                            function (a, b) {
                                return a.x - b.x;
                            }
                        );

                        const text =
                            cleanText(
                                row.items
                                    .map(
                                        function (
                                            item
                                        ) {
                                            return item.text;
                                        }
                                    )
                                    .join(" ")
                            );

                        const largestItem =
                            [...row.items].sort(
                                function (a, b) {
                                    return (
                                        b.fontSize -
                                        a.fontSize
                                    );
                                }
                            )[0];

                        return {
                            text: text,

                            y: row.y,

                            x: row.minimumX,

                            fontSize:
                                row.maxFontSize,

                            fontName:
                                largestItem
                                    .fontName,

                            items:
                                row.items
                        };
                    }
                )
                .filter(
                    function (line) {
                        return (
                            line.text.length >= 3 &&
                            isAllowedTitleText(
                                line.text
                            )
                        );
                    }
                );
        }

        function findTitleCombination(
            lines,
            styles
        ) {
            const scoredLines =
                lines.map(
                    function (line) {
                        return {
                            ...line,

                            score:
                                calculateTitleScore(
                                    line,
                                    styles
                                )
                        };
                    }
                );

            scoredLines.sort(
                function (a, b) {
                    return (
                        b.score -
                        a.score
                    );
                }
            );

            const mainTitle =
                scoredLines[0];

            if (!mainTitle) {
                return null;
            }

            /*
                Die kleine Titelzeile wird direkt
                oberhalb des grossen Titels gesucht.

                Beispiel:

                1:50 Skaliert
                3. Untergeschoss
            */

            const possibleSubtitles =
                lines
                    .filter(
                        function (line) {
                            if (
                                line.text ===
                                mainTitle.text
                            ) {
                                return false;
                            }

                            const isAbove =
                                line.y <
                                mainTitle.y;

                            const verticalDistance =
                                mainTitle.y -
                                line.y;

                            const maximumDistance =
                                Math.max(
                                    mainTitle.fontSize *
                                    3.5,
                                    20
                                );

                            const similarLeftPosition =
                                Math.abs(
                                    line.x -
                                    mainTitle.x
                                ) <=
                                Math.max(
                                    mainTitle.fontSize *
                                    3,
                                    30
                                );

                            const isSmaller =
                                line.fontSize <=
                                mainTitle.fontSize *
                                0.95;

                            const isNotTiny =
                                line.fontSize >=
                                mainTitle.fontSize *
                                0.35;

                            return (
                                isAbove &&
                                verticalDistance <=
                                maximumDistance &&
                                similarLeftPosition &&
                                isSmaller &&
                                isNotTiny &&
                                isSuitableSubtitle(
                                    line.text
                                )
                            );
                        }
                    )
                    .sort(
                        function (a, b) {
                            const distanceA =
                                mainTitle.y -
                                a.y;

                            const distanceB =
                                mainTitle.y -
                                b.y;

                            return (
                                distanceA -
                                distanceB
                            );
                        }
                    );

            const subtitle =
                possibleSubtitles.length > 0
                    ? possibleSubtitles[0]
                    : null;

            let fullTitle =
                mainTitle.text;

            if (subtitle) {
                fullTitle =
                    subtitle.text +
                    " · " +
                    mainTitle.text;
            }

            return {
                subtitle: subtitle,

                mainTitle:
                    mainTitle,

                fullTitle:
                    fullTitle
            };
        }

        function calculateTitleScore(
            line,
            styles
        ) {
            const style =
                styles[
                    line.fontName
                ] || {};

            const fontInformation =
                (
                    line.fontName +
                    " " +
                    String(
                        style.fontFamily || ""
                    )
                ).toLowerCase();

            const looksBold =
