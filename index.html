<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantester</title>

    <style>
        :root {
            --navy: #0f172a;
            --blue: #2563eb;
            --blue-dark: #1d4ed8;
            --red: #dc2626;
            --red-dark: #b91c1c;
            --background: #f3f4f6;
            --border: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--background);
            overflow: hidden;
        }

        header {
            height: 60px;
            padding: 0 16px 0 24px;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            align-items: center;
            gap: 15px;
            background: var(--navy);
            color: white;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        #planName {
            color: white;
            font-size: 17px;
            font-weight: normal;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #actions {
            justify-self: end;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            height: 38px;
            padding: 0 18px;
            border: none;
            border-radius: 7px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 15px;
            cursor: pointer;
        }

        #chooseButton,
        #testButton {
            background: var(--blue);
        }

        #chooseButton:hover,
        #testButton:hover {
            background: var(--blue-dark);
        }

        #testButton {
            display: none;
            align-items: center;
            gap: 8px;
        }

        #testButton:disabled {
            opacity: 0.6;
            cursor: progress;
        }

        #testIcon {
            width: 23px;
            height: 23px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            border-radius: 50%;
            font-weight: bold;
        }

        #closeButton {
            display: none;
            width: 38px;
            padding: 0;
            align-items: center;
            justify-content: center;
            background: var(--red);
            font-size: 28px;
        }

        #closeButton:hover {
            background: var(--red-dark);
        }

        #fileInput {
            display: none;
        }

        main {
            height: calc(100vh - 60px);
            padding: 18px;
        }

        #dropzone {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px dashed var(--border);
            border-radius: 14px;
            background: white;
            overflow: auto;
            transition: 0.2s;
        }

        #dropzone.dragover {
            border-color: var(--blue);
            background: #eff6ff;
        }

        #dropzone.pdfLoaded {
            align-items: flex-start;
            border: 1px solid #cbd5e1;
        }

        #message {
            padding: 30px;
            color: #64748b;
            font-size: 22px;
            line-height: 1.6;
            text-align: center;
        }

        #message strong {
            color: var(--navy);
        }

        #pdfCanvas {
            display: none;
            background: white;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.18);
        }

        #status {
            display: none;
            position: fixed;
            top: 78px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            max-width: 760px;
            padding: 10px 16px;
            border-radius: 7px;
            background: rgba(15, 23, 42, 0.95);
            color: white;
            font-size: 14px;
            text-align: center;
        }

        #status.success {
            background: #1e40af;
        }

        #status.notice {
            background: #475569;
        }

        #status.error {
            background: #b91c1c;
        }

        @media (max-width: 850px) {
            header {
                grid-template-columns: auto 1fr auto;
            }

            #planName {
                font-size: 14px;
            }

            button {
                padding: 0 12px;
            }

            #testButtonText {
                display: none;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Plantester</h1>

    <div id="planName"></div>

    <div id="actions">
        <button id="testButton" type="button">
            <span id="testIcon">✓</span>
            <span id="testButtonText">Plantester</span>
        </button>

        <button id="chooseButton" type="button">
            PDF auswählen
        </button>

        <button id="closeButton" type="button" title="PDF schliessen">
            ×
        </button>

        <input
            id="fileInput"
            type="file"
            accept="application/pdf,.pdf"
        >
    </div>
</header>

<main>
    <div id="dropzone">
        <div id="message">
            <strong>PDF-Plan hier hineinziehen</strong>
            <br>
            oder oben auf „PDF auswählen“ klicken
        </div>

        <canvas id="pdfCanvas"></canvas>
    </div>
</main>

<div id="status"></div>

<script type="module">

    import * as pdfjsLib from
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


    const dropzone =
        document.getElementById("dropzone");

    const message =
        document.getElementById("message");

    const canvas =
        document.getElementById("pdfCanvas");

    const context =
        canvas.getContext("2d");

    const chooseButton =
        document.getElementById("chooseButton");

    const testButton =
        document.getElementById("testButton");

    const closeButton =
        document.getElementById("closeButton");

    const fileInput =
        document.getElementById("fileInput");

    const planName =
        document.getElementById("planName");

    const status =
        document.getElementById("status");


    let firstPage = null;
    let baseViewport = null;
    let statusTimer = null;

    const REQUIRED_POINTS = 6;


    chooseButton.addEventListener("click", function () {
        fileInput.click();
    });


    fileInput.addEventListener("change", function () {
        if (fileInput.files[0]) {
            loadPdf(fileInput.files[0]);
        }
    });


    closeButton.addEventListener("click", resetViewer);

    testButton.addEventListener("click", analysePlan);


    dropzone.addEventListener("dragenter", activateDropzone);
    dropzone.addEventListener("dragover", activateDropzone);


    dropzone.addEventListener("dragleave", function (event) {
        event.preventDefault();
        dropzone.classList.remove("dragover");
    });


    dropzone.addEventListener("drop", function (event) {
        event.preventDefault();

        dropzone.classList.remove("dragover");

        const file =
            event.dataTransfer.files[0];

        if (file) {
            loadPdf(file);
        }
    });


    function activateDropzone(event) {
        event.preventDefault();
        dropzone.classList.add("dragover");
    }


    function showStatus(text, type = "") {
        clearTimeout(statusTimer);

        status.textContent = text;
        status.className = type;
        status.style.display = "block";
    }


    function hideStatus() {
        clearTimeout(statusTimer);

        status.style.display = "none";
        status.className = "";
    }


    function hideStatusLater() {
        clearTimeout(statusTimer);

        statusTimer =
            setTimeout(hideStatus, 3500);
    }


    function getDatePrefix() {
        const now = new Date();

        return (
            now.getFullYear() +
            String(now.getMonth() + 1).padStart(2, "0") +
            String(now.getDate()).padStart(2, "0")
        );
    }


    function cleanText(text) {
        return String(text || "")
            .replace(/\s+/g, " ")
            .replace(/^[|,;:._\-]+/, "")
            .replace(/[|,;:._\-]+$/, "")
            .trim();
    }


    function cleanNamePart(text) {
        return cleanText(text)
            .replace(/[\\/:*?"<>|]/g, "")
            .replace(/\s*-\s*/g, "-")
            .replace(/_+/g, "_")
            .trim();
    }


    async function loadPdf(file) {

        const isPdf =
            file.type === "application/pdf" ||
            file.name.toLowerCase().endsWith(".pdf");

        if (!isPdf) {
            showStatus(
                "Bitte eine PDF-Datei auswählen.",
                "error"
            );

            hideStatusLater();
            return;
        }

        try {
            showStatus("PDF wird geladen ...");

            const buffer =
                await file.arrayBuffer();

            const pdfDocument =
                await pdfjsLib
                    .getDocument({
                        data: new Uint8Array(buffer)
                    })
                    .promise;

            firstPage =
                await pdfDocument.getPage(1);

            baseViewport =
                firstPage.getViewport({
                    scale: 1
                });

            const availableWidth =
                Math.max(
                    500,
                    dropzone.clientWidth - 30
                );

            const availableHeight =
                Math.max(
                    400,
                    dropzone.clientHeight - 30
                );

            const fitScale =
                Math.min(
                    availableWidth / baseViewport.width,
                    availableHeight / baseViewport.height
                );

            const pixelRatio =
                Math.max(
                    1,
                    window.devicePixelRatio
                );

            const renderViewport =
                firstPage.getViewport({
                    scale: fitScale * pixelRatio
                });

            canvas.width =
                Math.floor(renderViewport.width);

            canvas.height =
                Math.floor(renderViewport.height);

            canvas.style.width =
                Math.floor(
                    renderViewport.width / pixelRatio
                ) + "px";

            canvas.style.height =
                Math.floor(
                    renderViewport.height / pixelRatio
                ) + "px";

            context.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            await firstPage.render({
                canvasContext: context,
                viewport: renderViewport
            }).promise;

            message.style.display = "none";
            canvas.style.display = "block";

            dropzone.classList.add("pdfLoaded");

            chooseButton.style.display = "none";
            testButton.style.display = "flex";
            closeButton.style.display = "flex";

            planName.textContent = "";
            planName.title = "";

            hideStatus();

        } catch (error) {
            console.error(error);

            showStatus(
                "Die PDF konnte nicht geöffnet werden.",
                "error"
            );

            hideStatusLater();
        }
    }


    async function analysePlan() {

        if (!firstPage || !baseViewport) {
            return;
        }

        testButton.disabled = true;

        planName.textContent = "";
        planName.title = "";

        try {
            showStatus(
                "Plankopf wird mit 10 Kriterien geprüft ..."
            );

            const textContent =
                await firstPage.getTextContent();

            if (
                !textContent.items ||
                textContent.items.length === 0
            ) {
                showImagePlan(
                    "Kein eingebetteter PDF-Text"
                );

                return;
            }

            const items =
                createTextItems(
                    textContent.items
                );

            const lines =
                groupIntoLines(items);

            const result =
                evaluateTitlePairs(
                    lines,
                    textContent.styles || {}
                );

            if (
                !result ||
                result.points < REQUIRED_POINTS
            ) {
                const points =
                    result ? result.points : 0;

                showImagePlan(
                    points +
                    " von 10 Kriterien erfüllt"
                );

                return;
            }

            const finalName =
                getDatePrefix() +
                "_" +
                cleanNamePart(
                    result.smallTitle.text
                ) +
                "_" +
                cleanNamePart(
                    result.mainTitle.text
                );

            planName.textContent =
                finalName;

            planName.title =
                createChecklistText(result);

            showStatus(
                "Plankopf erkannt - " +
                result.points +
                " von 10 Kriterien",
                "success"
            );

            hideStatusLater();

        } catch (error) {
            console.error(error);

            showImagePlan(
                "Plankopfprüfung nicht möglich"
            );

        } finally {
            testButton.disabled = false;
        }
    }


    function createTextItems(rawItems) {

        const result = [];

        for (const rawItem of rawItems) {

            const text =
                cleanText(rawItem.str);

            if (!text || text.length < 2) {
                continue;
            }

            const transformed =
                pdfjsLib.Util.transform(
                    baseViewport.transform,
                    rawItem.transform
                );

            const matrixSize =
                Math.sqrt(
                    rawItem.transform[2] ** 2 +
                    rawItem.transform[3] ** 2
                );

            result.push({
                text: text,
                x: transformed[4],
                y: transformed[5],
                fontSize:
                    Math.max(
                        Number(rawItem.height) || 0,
                        matrixSize || 0
                    ),
                fontName:
                    rawItem.fontName || ""
            });
        }

        return result;
    }


    function groupIntoLines(items) {

        const sorted =
            [...items].sort(function (a, b) {

                const tolerance =
                    Math.max(
                        a.fontSize,
                        b.fontSize,
                        5
                    ) * 0.45;

                if (
                    Math.abs(a.y - b.y) <=
                    tolerance
                ) {
                    return a.x - b.x;
                }

                return a.y - b.y;
            });


        const rows = [];


        for (const item of sorted) {

            let matchingRow = null;

            for (const row of rows) {

                const tolerance =
                    Math.max(
                        row.fontSize,
                        item.fontSize,
                        5
                    ) * 0.5;

                if (
                    Math.abs(
                        row.y - item.y
                    ) <= tolerance
                ) {
                    matchingRow = row;
                    break;
                }
            }


            if (matchingRow) {

                matchingRow.items.push(item);

                matchingRow.fontSize =
                    Math.max(
                        matchingRow.fontSize,
                        item.fontSize
                    );

                matchingRow.x =
                    Math.min(
                        matchingRow.x,
                        item.x
                    );

            } else {

                rows.push({
                    x: item.x,
                    y: item.y,
                    fontSize: item.fontSize,
                    items: [item]
                });
            }
        }


        return rows
            .map(function (row) {

                row.items.sort(
                    function (a, b) {
                        return a.x - b.x;
                    }
                );

                const largestItem =
                    [...row.items].sort(
                        function (a, b) {
                            return (
                                b.fontSize -
                                a.fontSize
                            );
                        }
                    )[0];

                return {
                    text:
                        cleanText(
                            row.items
                                .map(
                                    function (item) {
                                        return item.text;
                                    }
                                )
                                .join(" ")
                        ),

                    x: row.x,
                    y: row.y,
                    fontSize: row.fontSize,
                    fontName: largestItem.fontName
                };
            })
            .filter(
                function (line) {
                    return line.text.length >= 3;
                }
            );
    }


    function evaluateTitlePairs(
        lines,
        styles
    ) {

        const lowerRightLines =
            lines.filter(
                function (line) {
                    return (
                        line.y >=
                        baseViewport.height * 0.45 &&

                        line.x >=
                        baseViewport.width * 0.40
                    );
                }
            );


        /*
            Typische Wörter im gesamten
            unteren rechten Plankopfbereich.
        */

        const titleBlockText =
            lowerRightLines
                .map(
                    function (line) {
                        return line.text;
                    }
                )
                .join(" ");


        const candidates = [];


        for (
            const smallTitle
            of lowerRightLines
        ) {
            for (
                const mainTitle
                of lowerRightLines
            ) {

                if (smallTitle === mainTitle) {
                    continue;
                }

                const isBelow =
                    mainTitle.y >
                    smallTitle.y;

                const verticalDistance =
                    mainTitle.y -
                    smallTitle.y;

                const horizontalDistance =
                    Math.abs(
                        mainTitle.x -
                        smallTitle.x
                    );

                if (
                    !isBelow ||
                    verticalDistance >
                    Math.max(
                        mainTitle.fontSize * 5,
                        40
                    )
                ) {
                    continue;
                }


                const checks = [];


                /*
                    1. Untere Planhälfte
                */

                checks.push({
                    name:
                        "Titel in unterer Planhälfte",

                    passed:
                        mainTitle.y >=
                        baseViewport.height * 0.50
                });


                /*
                    2. Rechte Planhälfte
                */

                checks.push({
                    name:
                        "Titel in rechter Planhälfte",

                    passed:
                        mainTitle.x >=
                        baseViewport.width * 0.45
                });


                /*
                    3. Typische kleine Titelzeile
                */

                checks.push({
                    name:
                        "Typische kleine Titelzeile",

                    passed:
                        isTypicalSmallTitle(
                            smallTitle.text
                        )
                });


                /*
                    4. Haupttitel direkt darunter
                */

                checks.push({
                    name:
                        "Haupttitel direkt darunter",

                    passed:
                        verticalDistance <=
                        Math.max(
                            mainTitle.fontSize * 4,
                            32
                        )
                });


                /*
                    5. Haupttitel ist grösser
                */

                checks.push({
                    name:
                        "Haupttitel grössere Schrift",

                    passed:
                        mainTitle.fontSize >
                        smallTitle.fontSize * 1.05
                });


                /*
                    6. Gleiche linke Ausrichtung
                */

                checks.push({
                    name:
                        "Titelzeilen gleich ausgerichtet",

                    passed:
                        horizontalDistance <=
                        Math.max(
                            mainTitle.fontSize * 4,
                            45
                        )
                });


                /*
                    7. Plausible Haupttitellänge
                */

                checks.push({
                    name:
                        "Plausible Haupttitellänge",

                    passed:
                        mainTitle.text.length >= 4 &&
                        mainTitle.text.length <= 85
                });


                /*
                    8. Keine Metadaten
                */

                checks.push({
                    name:
                        "Keine Höhen- oder Metadaten",

                    passed:
                        !containsForbiddenText(
                            mainTitle.text
                        )
                });


                /*
                    9. Typische Plankopfinhalte
                */

                checks.push({
                    name:
                        "Typische Plankopfinhalte vorhanden",

                    passed:
                        /planrevision|sanierung|bauvorhaben|massstab|maßstab|projekt|architekt|bauherr|gezeichnet|revision|index|plannummer/i
                            .test(titleBlockText)
                });


                /*
                    10. Fett oder deutlich grösser
                */

                checks.push({
                    name:
                        "Haupttitel hervorgehoben",

                    passed:
                        looksBold(
                            mainTitle,
                            styles
                        ) ||

                        mainTitle.fontSize >=
                        smallTitle.fontSize * 1.35
                });


                const points =
                    checks.filter(
                        function (check) {
                            return check.passed;
                        }
                    ).length;


                candidates.push({
                    smallTitle: smallTitle,
                    mainTitle: mainTitle,
                    checks: checks,
                    points: points,

                    ranking:
                        points * 1000 +

                        mainTitle.fontSize * 20 +

                        (
                            mainTitle.y /
                            baseViewport.height
                        ) * 200 +

                        (
                            mainTitle.x /
                            baseViewport.width
                        ) * 100 -

                        verticalDistance -

                        horizontalDistance
                });
            }
        }


        if (candidates.length === 0) {
            return null;
        }


        candidates.sort(
            function (a, b) {
                return b.ranking - a.ranking;
            }
        );


        return candidates[0];
    }


    function isTypicalSmallTitle(text) {

        return (
            /^(detail|grundriss|schnitt|ansicht|fassade|übersicht|ausführung|bestand|abbruch|neubau)$/i
                .test(text) ||

            /\b1\s*:\s*\d+\b/i
                .test(text) ||

            /skaliert|bauetappe|mieterplan/i
                .test(text)
        );
    }


    function containsForbiddenText(text) {

        return (
            /\bm\s*ü\.?\s*m\.?\b/i
                .test(text) ||

            /parz\.?\s*nr|bauvorhaben|bahnhofplatz|telefon|@|www\.|datum|revision|plannummer|plan nr|projekt nr|projektnummer/i
                .test(text) ||

            /räschle|helvetia|weber partner|weberpart|logistik/i
                .test(text)
        );
    }


    function looksBold(
        line,
        styles
    ) {

        const style =
            styles[line.fontName] || {};

        const description =
            (
                line.fontName +
                " " +
                String(
                    style.fontFamily || ""
                )
            ).toLowerCase();

        return (
            /bold|black|heavy|demi|semibold/
                .test(description)
        );
    }


    function createChecklistText(result) {

        return (
            result.points +
            " von 10 Kriterien erfüllt\n\n" +

            result.checks
                .map(
                    function (check, index) {
                        return (
                            (index + 1) +
                            ". " +
                            (
                                check.passed
                                    ? "JA"
                                    : "NEIN"
                            ) +
                            " - " +
                            check.name
                        );
                    }
                )
                .join("\n") +

            "\n\nKleine Bezeichnung: " +
            result.smallTitle.text +

            "\nHauptbezeichnung: " +
            result.mainTitle.text
        );
    }


    function showImagePlan(reason) {

        const imageName =
            getDatePrefix() +
            "_Bildplan";

        planName.textContent =
            imageName;

        planName.title =
            reason;

        showStatus(
            "Kein sicherer Plankopf - " +
            reason,
            "notice"
        );

        hideStatusLater();
    }


    function resetViewer() {

        clearTimeout(statusTimer);

        firstPage = null;
        baseViewport = null;

        context.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        canvas.width = 0;
        canvas.height = 0;
        canvas.style.display = "none";

        message.style.display = "block";

        dropzone.classList.remove(
            "pdfLoaded",
            "dragover"
        );

        chooseButton.style.display = "block";
        testButton.style.display = "none";
        testButton.disabled = false;
        closeButton.style.display = "none";

        planName.textContent = "";
        planName.title = "";

        fileInput.value = "";

        hideStatus();
    }

</script>

</body>
</html>
