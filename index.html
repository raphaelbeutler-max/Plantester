<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plantester</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            overflow: hidden;
        }

        header {
            height: 60px;
            padding: 0 25px;
            background-color: #0f172a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        #chooseButton {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        #chooseButton:hover {
            background-color: #1d4ed8;
        }

        #fileInput {
            display: none;
        }

        main {
            height: calc(100vh - 60px);
            padding: 18px;
        }

        #dropzone {
            width: 100%;
            height: 100%;
            border: 4px dashed #94a3b8;
            border-radius: 14px;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: 0.2s;
        }

        #dropzone.dragover {
            border-color: #2563eb;
            background-color: #eff6ff;
        }

        #message {
            text-align: center;
            color: #64748b;
            font-size: 22px;
            line-height: 1.6;
            padding: 30px;
        }

        #message strong {
            color: #0f172a;
        }

        #viewer {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            background-color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>Plantester</h1>

        <div>
            <button id="chooseButton" type="button">
                PDF auswählen
            </button>

            <input
                id="fileInput"
                type="file"
                accept="application/pdf,.pdf"
            >
        </div>
    </header>

    <main>
        <div id="dropzone">

            <div id="message">
                <strong>PDF-Plan hier hineinziehen</strong>
                <br>
                oder oben auf „PDF auswählen“ klicken
            </div>

            <iframe
                id="viewer"
                title="PDF-Planansicht">
            </iframe>

        </div>
    </main>

    <script>
        const dropzone = document.getElementById("dropzone");
        const viewer = document.getElementById("viewer");
        const message = document.getElementById("message");
        const chooseButton = document.getElementById("chooseButton");
        const fileInput = document.getElementById("fileInput");

        let currentPdfUrl = null;

        chooseButton.addEventListener("click", function () {
            fileInput.click();
        });

        fileInput.addEventListener("change", function () {
            if (fileInput.files.length > 0) {
                showPdf(fileInput.files[0]);
            }
        });

        dropzone.addEventListener("dragover", function (event) {
            event.preventDefault();
            dropzone.classList.add("dragover");
        });

        dropzone.addEventListener("dragleave", function () {
            dropzone.classList.remove("dragover");
        });

        dropzone.addEventListener("drop", function (event) {
            event.preventDefault();
            dropzone.classList.remove("dragover");

            if (event.dataTransfer.files.length > 0) {
                showPdf(event.dataTransfer.files[0]);
            }
        });

        function showPdf(file) {
            const isPdf =
                file.type === "application/pdf" ||
                file.name.toLowerCase().endsWith(".pdf");

            if (!isPdf) {
                alert("Bitte eine PDF-Datei auswählen.");
                return;
            }

            if (currentPdfUrl) {
                URL.revokeObjectURL(currentPdfUrl);
            }

            currentPdfUrl = URL.createObjectURL(file);

            viewer.src = currentPdfUrl;
            viewer.style.display = "block";
            message.style.display = "none";
        }
    </script>

</body>
</html>
