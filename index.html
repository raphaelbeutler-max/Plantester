<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plantester</title>

    <style>
        :root {
            --navy: #0f172a;
            --blue: #2563eb;
            --blue-hover: #1d4ed8;
            --red: #dc2626;
            --red-hover: #b91c1c;
            --background: #f3f4f6;
            --border: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--background);
            overflow: hidden;
        }

        header {
            height: 60px;
            padding: 0 16px 0 24px;
            background: var(--navy);
            color: white;

            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            align-items: center;
            gap: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        #planName {
            color: white;
            font-size: 17px;
            font-weight: normal;
            text-align: center;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #actions {
            justify-self: end;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            height: 38px;
            padding: 0 18px;

            border: none;
            border-radius: 7px;

            color: white;
            font-family: Arial, sans-serif;
            font-size: 15px;

            cursor: pointer;
        }

        #chooseButton,
        #testButton {
            background: var(--blue);
        }

        #chooseButton:hover,
        #testButton:hover {
            background: var(--blue-hover);
        }

        #testButton {
            display: none;
            align-items: center;
            gap: 8px;
        }

        #testButton:disabled {
            opacity: 0.6;
            cursor: progress;
        }

        #testIcon {
            width: 23px;
            height: 23px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border: 2px solid white;
            border-radius: 50%;

            font-weight: bold;
        }

        #closeButton {
            display: none;
            align-items: center;
            justify-content: center;

            width: 38px;
            padding: 0;

            background: var(--red);
            font-size: 28px;
        }

        #closeButton:hover {
            background: var(--red-hover);
        }

        #fileInput {
            display: none;
        }

        main {
            height: calc(100vh - 60px);
            padding: 18px;
        }

        #dropzone {
            width: 100%;
            height: 100%;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 4px dashed var(--border);
            border-radius: 14px;

            background: white;
            overflow: auto;

            transition: 0.2s;
        }

        #dropzone.dragover {
            border-color: var(--blue);
            background: #eff6ff;
        }

        #dropzone.pdfLoaded {
            align-items: flex-start;
            border: 1px solid #cbd5e1;
        }

        #message {
            padding: 30px;
            color: #64748b;
            font-size: 22px;
            line-height: 1.6;
            text-align: center;
        }

        #message strong {
            color: var(--navy);
        }

        #pdfCanvas {
            display: none;
            background: white;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.18);
        }

        #status {
            display: none;

            position: fixed;
            top: 78px;
            left: 50%;
            transform: translateX(-50%);

            z-index: 100;

            max-width: 700px;
            padding: 10px 16px;

            border-radius: 7px;
            background: rgba(15, 23, 42, 0.95);

            color: white;
            font-size: 14px;
            text-align: center;
        }

        #status.success {
            background: #1e40af;
        }

        #status.error {
            background: #b91c1c;
        }

        @media (max-width: 850px) {
            header {
                grid-template-columns: auto 1fr auto;
            }

            #planName {
                font-size: 14px;
            }

            button {
                padding: 0 12px;
            }

            #testButtonText {
                display: none;
            }
        }
    </style>
</head>

<body>

    <header>

        <h1>Plantester</h1>

        <div id="planName"></div>

        <div id="actions">

            <button
                id="testButton"
                type="button"
                title="Planname prüfen"
            >
                <span id="testIcon">✓</span>

                <span id="testButtonText">
                    Plantester
                </span>
            </button>

            <button
                id="chooseButton"
                type="button"
            >
                PDF auswählen
            </button>

            <button
                id="closeButton"
                type="button"
                title="PDF schliessen"
            >
                ×
            </button>

            <input
                id="fileInput"
                type="file"
                accept="application/pdf,.pdf"
            >

        </div>

    </header>

    <main>

        <div id="dropzone">

            <div id="message">

                <strong>
                    PDF-Plan hier hineinziehen
                </strong>

                <br>

                oder oben auf „PDF auswählen“ klicken

            </div>

            <canvas id="pdfCanvas"></canvas>

        </div>

    </main>

    <div id="status"></div>

    <script type="module">

        import * as pdfjsLib from
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

        pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


        const dropzone =
            document.getElementById("dropzone");

        const message =
            document.getElementById("message");

        const canvas =
            document.getElementById("pdfCanvas");

        const context =
            canvas.getContext("2d");

        const chooseButton =
            document.getElementById("chooseButton");

        const testButton =
            document.getElementById("testButton");

        const closeButton =
            document.getElementById("closeButton");

        const fileInput =
            document.getElementById("fileInput");

        const planName =
            document.getElementById("planName");

        const status =
            document.getElementById("status");


        let pdfDocument = null;
        let firstPage = null;
        let baseViewport = null;
        let statusTimer = null;


        /*
            LESEBEREICH

            Links:
            5 Prozent der Planbreite.

            Rechts:
            68 Prozent der Planbreite.

            Der Bereich endet damit ungefähr
            beim Zentrum des Nordpfeils.

            Oben:
            68 Prozent der Planhöhe.

            Unten:
            99 Prozent der Planhöhe.
        */

        const X_MIN = 0.05;
        const X_MAX = 0.68;
        const Y_MIN = 0.68;
        const Y_MAX = 0.99;


        chooseButton.addEventListener(
            "click",
            function () {
                fileInput.click();
            }
        );


        fileInput.addEventListener(
            "change",
            function () {
                if (fileInput.files.length > 0) {
                    loadPdf(fileInput.files[0]);
                }
            }
        );


        closeButton.addEventListener(
            "click",
            resetViewer
        );


        testButton.addEventListener(
            "click",
            detectPlanName
        );


        dropzone.addEventListener(
            "dragenter",
            handleDragOver
        );


        dropzone.addEventListener(
            "dragover",
            handleDragOver
        );


        dropzone.addEventListener(
            "dragleave",
            function (event) {
                event.preventDefault();

                dropzone.classList.remove(
                    "dragover"
                );
            }
        );


        dropzone.addEventListener(
            "drop",
            function (event) {
                event.preventDefault();

                dropzone.classList.remove(
                    "dragover"
                );

                const file =
                    event.dataTransfer.files[0];

                if (file) {
                    loadPdf(file);
                }
            }
        );


        function handleDragOver(event) {
            event.preventDefault();

            dropzone.classList.add(
                "dragover"
            );
        }


        function showStatus(text, type = "") {
            clearTimeout(statusTimer);

            status.textContent = text;
            status.className = type;
            status.style.display = "block";
        }


        function hideStatus() {
            clearTimeout(statusTimer);

            status.style.display = "none";
            status.className = "";
        }


        function hideStatusLater() {
            clearTimeout(statusTimer);

            statusTimer = setTimeout(
                hideStatus,
                2500
            );
        }


        async function loadPdf(file) {

            const isPdf =
                file.type === "application/pdf" ||
                file.name.toLowerCase().endsWith(".pdf");

            if (!isPdf) {
                showStatus(
                    "Bitte eine PDF-Datei auswählen.",
                    "error"
                );

                hideStatusLater();

                return;
            }

            try {
                showStatus(
                    "PDF wird geladen ..."
                );

                const buffer =
                    await file.arrayBuffer();

                pdfDocument =
                    await pdfjsLib
                        .getDocument({
                            data: new Uint8Array(buffer)
                        })
                        .promise;

                firstPage =
                    await pdfDocument.getPage(1);

                baseViewport =
                    firstPage.getViewport({
                        scale: 1
                    });

                const availableWidth =
                    Math.max(
                        500,
                        dropzone.clientWidth - 30
                    );

                const availableHeight =
                    Math.max(
                        400,
                        dropzone.clientHeight - 30
                    );

                const fitScale =
                    Math.min(
                        availableWidth /
                        baseViewport.width,

                        availableHeight /
                        baseViewport.height
                    );

                const pixelRatio =
                    Math.max(
                        1,
                        window.devicePixelRatio
                    );

                const renderViewport =
                    firstPage.getViewport({
                        scale:
                            fitScale * pixelRatio
                    });

                canvas.width =
                    Math.floor(
                        renderViewport.width
                    );

                canvas.height =
                    Math.floor(
                        renderViewport.height
                    );

                canvas.style.width =
                    Math.floor(
                        renderViewport.width /
                        pixelRatio
                    ) + "px";

                canvas.style.height =
                    Math.floor(
                        renderViewport.height /
                        pixelRatio
                    ) + "px";

                context.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                await firstPage.render({
                    canvasContext: context,
                    viewport: renderViewport
                }).promise;

                message.style.display =
                    "none";

                canvas.style.display =
                    "block";

                dropzone.classList.add(
                    "pdfLoaded"
                );

                chooseButton.style.display =
                    "none";

                testButton.style.display =
                    "flex";

                closeButton.style.display =
                    "flex";

                planName.textContent = "";
                planName.title = "";

                hideStatus();

            } catch (error) {
                console.error(error);

                showStatus(
                    "Die PDF konnte nicht geöffnet werden.",
                    "error"
                );

                hideStatusLater();
            }
        }


        async function detectPlanName() {

            if (!firstPage || !baseViewport) {
                return;
            }

            testButton.disabled = true;

            planName.textContent = "";
            planName.title = "";

            try {
                showStatus(
                    "Planname wird gesucht ..."
                );

                const textContent =
                    await firstPage.getTextContent();

                const items =
                    createTextItems(
                        textContent.items
                    );

                const itemsInTitleBlock =
                    filterTitleBlock(items);

                const lines =
                    groupIntoLines(
                        itemsInTitleBlock
                    );

                const result =
                    findMainAndSmallTitle(
                        lines,
                        textContent.styles || {}
                    );

                if (!result) {
                    planName.textContent =
                        "Kein Planname erkannt";

                    showStatus(
                        "Kein geeigneter Text im Plankopf gefunden.",
                        "error"
                    );

                    hideStatusLater();

                    return;
                }

                planName.textContent =
                    result.fullTitle;

                planName.title =
                    result.debugText;

                showStatus(
                    "Planname erkannt",
                    "success"
                );

                hideStatusLater();

            } catch (error) {
                console.error(error);

                planName.textContent =
                    "Erkennung nicht möglich";

                showStatus(
                    "PDF-Text konnte nicht ausgewertet werden.",
                    "error"
                );

                hideStatusLater();

            } finally {
                testButton.disabled = false;
            }
        }


        function createTextItems(rawItems) {

            const result = [];

            for (const rawItem of rawItems) {

                const text =
                    cleanText(rawItem.str);

                if (!text || text.length < 2) {
                    continue;
                }

                const transformed =
                    pdfjsLib.Util.transform(
                        baseViewport.transform,
                        rawItem.transform
                    );

                const fontSizeFromMatrix =
                    Math.sqrt(
                        rawItem.transform[2] ** 2 +
                        rawItem.transform[3] ** 2
                    );

                result.push({
                    text: text,

                    x: transformed[4],

                    y: transformed[5],

                    width:
                        Number(rawItem.width) || 0,

                    fontSize:
                        Math.max(
                            Number(rawItem.height) || 0,
                            fontSizeFromMatrix || 0
                        ),

                    fontName:
                        rawItem.fontName || ""
                });
            }

            return result;
        }


        function filterTitleBlock(items) {

            const minX =
                baseViewport.width * X_MIN;

            const maxX =
                baseViewport.width * X_MAX;

            const minY =
                baseViewport.height * Y_MIN;

            const maxY =
                baseViewport.height * Y_MAX;

            return items.filter(
                function (item) {
                    return (
                        item.x >= minX &&
                        item.x <= maxX &&
                        item.y >= minY &&
                        item.y <= maxY
                    );
                }
            );
        }


        function groupIntoLines(items) {

            const sorted =
                [...items].sort(
                    function (a, b) {

                        const tolerance =
                            Math.max(
                                a.fontSize,
                                b.fontSize,
                                5
                            ) * 0.5;

                        if (
                            Math.abs(a.y - b.y) <=
                            tolerance
                        ) {
                            return a.x - b.x;
                        }

                        return a.y - b.y;
                    }
                );

            const rows = [];

            for (const item of sorted) {

                let matchingRow = null;

                for (const row of rows) {

                    const tolerance =
                        Math.max(
                            row.fontSize,
                            item.fontSize,
                            5
                        ) * 0.55;

                    if (
                        Math.abs(row.y - item.y) <=
                        tolerance
                    ) {
                        matchingRow = row;
                        break;
                    }
                }

                if (matchingRow) {

                    matchingRow.items.push(item);

                    matchingRow.fontSize =
                        Math.max(
                            matchingRow.fontSize,
                            item.fontSize
                        );

                    matchingRow.x =
                        Math.min(
                            matchingRow.x,
                            item.x
                        );

                } else {

                    rows.push({
                        y: item.y,
                        x: item.x,
                        fontSize: item.fontSize,
                        items: [item]
                    });
                }
            }

            return rows
                .map(
                    function (row) {

                        row.items.sort(
                            function (a, b) {
                                return a.x - b.x;
                            }
                        );

                        const biggestItem =
                            [...row.items].sort(
                                function (a, b) {
                                    return (
                                        b.fontSize -
                                        a.fontSize
                                    );
                                }
                            )[0];

                        return {
                            text:
                                cleanText(
                                    row.items
                                        .map(
                                            function (item) {
                                                return item.text;
                                            }
                                        )
                                        .join(" ")
                                ),

                            x: row.x,
                            y: row.y,

                            fontSize:
                                row.fontSize,

                            fontName:
                                biggestItem.fontName
                        };
                    }
                )
                .filter(
                    function (line) {
                        return (
                            line.text.length >= 3 &&
                            isUsableLine(line.text)
                        );
                    }
                );
        }


        function findMainAndSmallTitle(
            lines,
            styles
        ) {

            if (lines.length === 0) {
                return null;
            }

            const scored =
                lines.map(
                    function (line) {

                        return {
                            ...line,

                            score:
                                calculateScore(
                                    line,
                                    styles
                                )
                        };
                    }
                );


            scored.sort(
                function (a, b) {
                    return b.score - a.score;
                }
            );


            const mainTitle =
                scored[0];


            if (!mainTitle) {
                return null;
            }


            /*
                Kleine Zeile direkt oberhalb
                des grossen Titels suchen.
            */

            const subtitleCandidates =
                lines
                    .filter(
                        function (line) {

                            if (
                                line.text ===
                                mainTitle.text
                            ) {
                                return false;
                            }

                            const isAbove =
                                line.y < mainTitle.y;

                            const verticalDistance =
                                mainTitle.y - line.y;

                            const closeEnough =
                                verticalDistance <=
                                Math.max(
                                    mainTitle.fontSize * 4,
                                    24
                                );

                            const similarLeftEdge =
                                Math.abs(
                                    line.x -
                                    mainTitle.x
                                ) <=
                                Math.max(
                                    mainTitle.fontSize * 4,
                                    35
                                );

                            const isSmaller =
                                line.fontSize <
                                mainTitle.fontSize;

                            const notTooSmall =
                                line.fontSize >=
                                mainTitle.fontSize * 0.35;

                            return (
                                isAbove &&
                                closeEnough &&
                                similarLeftEdge &&
                                isSmaller &&
                                notTooSmall &&
                                isSubtitle(line.text)
                            );
                        }
                    )
                    .sort(
                        function (a, b) {

                            const distanceA =
                                mainTitle.y - a.y;

                            const distanceB =
                                mainTitle.y - b.y;

                            return distanceA - distanceB;
                        }
                    );


            const subtitle =
                subtitleCandidates[0] || null;


            const fullTitle =
                subtitle
                    ? subtitle.text +
                      " · " +
                      mainTitle.text

                    : mainTitle.text;


            const debugText =
                lines
                    .map(
                        function (line) {
                            return (
                                line.text +
                                " | Grösse " +
                                line.fontSize.toFixed(1)
                            );
                        }
                    )
                    .join("\n");


            return {
                mainTitle: mainTitle,
                subtitle: subtitle,
                fullTitle: fullTitle,
                debugText: debugText
            };
        }


        function calculateScore(
            line,
            styles
        ) {

            let score =
                line.fontSize * 100;


            const style =
                styles[line.fontName] || {};


            const fontDescription =
                (
                    line.fontName +
                    " " +
                    String(style.fontFamily || "")
                ).toLowerCase();


            if (
                /bold|black|heavy|demi|semibold/
                    .test(fontDescription)
            ) {
                score += 300;
            }


            if (
                /untergeschoss|erdgeschoss|obergeschoss|dachgeschoss|geschoss|grundriss|schnitt|ansicht|detail|sockel|decke|wand|boden|dach|fassade|treppe|türe|fenster|neu|bestand|abbruch/i
                    .test(line.text)
            ) {
                score += 180;
            }


            if (
                /\bm\s*ü\.?\s*m\.?\b/i
                    .test(line.text)
            ) {
                score -= 1500;
            }


            if (
                /parz|bauvorhaben|bahnhofplatz|frauenfeld|telefon|@|www\.|projekt|plannummer|revision|datum|massstab|maßstab/i
                    .test(line.text)
            ) {
                score -= 900;
            }


            if (line.text.length < 5) {
                score -= 200;
            }


            if (line.text.length > 100) {
                score -= 300;
            }


            return score;
        }


        function isSubtitle(text) {

            if (
                /\bm\s*ü\.?\s*m\.?\b/i
                    .test(text)
            ) {
                return false;
            }


            if (
                /parz|bauvorhaben|adresse|telefon|@|www\.|datum|revision|plannummer/i
                    .test(text)
            ) {
                return false;
            }


            /*
                Bevorzugte kleine Titel:

                1:50 Skaliert
                1:100 Übersicht
                Detail
                Ausführung
                Abbruch
            */

            if (
                /\b1\s*:\s*\d+\b/i
                    .test(text)
            ) {
                return true;
            }


            if (
                /skaliert|übersicht|detail|ausführung|abbruch|bestand|neu|mieterplan|bauetappe/i
                    .test(text)
            ) {
                return true;
            }


            return (
                text.length >= 4 &&
                text.length <= 55
            );
        }


        function isUsableLine(text) {

            if (
                /\bm\s*ü\.?\s*m\.?\b/i
                    .test(text)
            ) {
                return false;
            }


            if (
                /parz\.?\s*nr|bauvorhaben|bahnhofplatz|telefon|@|www\.|räschle|helvetia|weber partner|weberpart|logistik/i
                    .test(text)
            ) {
                return false;
            }


            if (
                /^(datum|revision|index|plannummer|plan nr|massstab|maßstab|format|gezeichnet|geprüft)$/i
                    .test(text)
            ) {
                return false;
            }


            return true;
        }


        function cleanText(text) {

            if (!text) {
                return "";
            }


            return text
                .replace(/\s+/g, " ")
                .replace(
                    /^[|,;:._\-]+/,
                    ""
                )
                .replace(
                    /[|,;:._\-]+$/,
                    ""
                )
                .trim();
        }


        function resetViewer() {

            clearTimeout(statusTimer);

            pdfDocument = null;
            firstPage = null;
            baseViewport = null;

            context.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            canvas.width = 0;
            canvas.height = 0;

            canvas.style.display =
                "none";

            message.style.display =
                "block";

            dropzone.classList.remove(
                "pdfLoaded"
            );

            dropzone.classList.remove(
                "dragover"
            );

            chooseButton.style.display =
                "block";

            testButton.style.display =
                "none";

            testButton.disabled =
                false;

            closeButton.style.display =
                "none";

            planName.textContent = "";
            planName.title = "";

            fileInput.value = "";

            hideStatus();
        }

    </script>

</body>
</html>
