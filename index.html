<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Plantester</title>

    <style>
        :root {
            --dunkelblau: #0f172a;
            --koenigsblau: #2563eb;
            --koenigsblau-dunkel: #1d4ed8;
            --rot: #dc2626;
            --rot-dunkel: #b91c1c;
            --hintergrund: #f3f4f6;
            --rahmen: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family: Arial, sans-serif;

            background-color: var(--hintergrund);

            overflow: hidden;
        }

        header {
            height: 60px;

            padding: 0 16px 0 24px;

            display: grid;

            grid-template-columns:
                minmax(180px, 1fr)
                minmax(250px, 2fr)
                minmax(250px, 1fr);

            align-items: center;

            gap: 15px;

            background-color: var(--dunkelblau);
            color: white;
        }

        header h1 {
            margin: 0;

            color: white;

            font-size: 24px;
            font-weight: bold;
        }

        #planName {
            width: 100%;

            color: white;

            font-size: 17px;
            font-weight: normal;

            text-align: center;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #actions {
            justify-self: end;

            display: flex;
            align-items: center;

            gap: 10px;
        }

        button {
            height: 38px;

            padding: 0 18px;

            border: none;
            border-radius: 7px;

            color: white;

            font-family: Arial, sans-serif;
            font-size: 15px;

            cursor: pointer;
        }

        #chooseButton,
        #testButton {
            background-color: var(--koenigsblau);
        }

        #chooseButton:hover,
        #testButton:hover {
            background-color: var(--koenigsblau-dunkel);
        }

        #testButton {
            display: none;

            align-items: center;

            gap: 9px;
        }

        #testButton:disabled {
            opacity: 0.65;
            cursor: progress;
        }

        #testIcon {
            width: 24px;
            height: 24px;

            display: inline-flex;

            justify-content: center;
            align-items: center;

            border: 2px solid white;
            border-radius: 50%;

            color: white;

            font-size: 15px;
            font-weight: bold;
        }

        #closeButton {
            display: none;

            width: 38px;
            height: 38px;

            padding: 0;

            justify-content: center;
            align-items: center;

            background-color: var(--rot);

            color: white;

            font-size: 28px;
            font-weight: normal;

            line-height: 1;
        }

        #closeButton:hover {
            background-color: var(--rot-dunkel);
        }

        #fileInput {
            display: none;
        }

        main {
            height: calc(100vh - 60px);

            padding: 18px;
        }

        #dropzone {
            width: 100%;
            height: 100%;

            position: relative;

            display: flex;

            justify-content: center;
            align-items: center;

            border: 4px dashed var(--rahmen);
            border-radius: 14px;

            background-color: white;

            overflow: auto;

            transition:
                border-color 0.2s,
                background-color 0.2s;
        }

        #dropzone.dragover {
            border-color: var(--koenigsblau);

            background-color: #eff6ff;
        }

        #dropzone.pdfLoaded {
            align-items: flex-start;

            border: 1px solid #cbd5e1;
        }

        #message {
            padding: 30px;

            color: #64748b;

            font-size: 22px;
            line-height: 1.6;

            text-align: center;
        }

        #message strong {
            color: var(--dunkelblau);
        }

        #pdfCanvas {
            display: none;

            background-color: white;

            box-shadow:
                0 2px 16px
                rgba(0, 0, 0, 0.18);
        }

        #status {
            display: none;

            position: fixed;

            top: 78px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 100;

            min-width: 270px;

            padding: 11px 17px;

            border-radius: 7px;

            background-color:
                rgba(15, 23, 42, 0.95);

            color: white;

            font-size: 14px;

            text-align: center;

            pointer-events: none;
        }

        #status.error {
            background-color:
                rgba(185, 28, 28, 0.96);
        }

        #status.success {
            background-color:
                rgba(30, 64, 175, 0.96);
        }

        #ocrCanvas {
            display: none;
        }

        @media (max-width: 850px) {
            header {
                grid-template-columns:
                    auto
                    1fr
                    auto;
            }

            #planName {
                font-size: 14px;
            }

            button {
                padding: 0 12px;
            }

            #testButtonText {
                display: none;
            }
        }
    </style>
</head>

<body>

    <header>

        <h1>Plantester</h1>

        <div
            id="planName"
            title=""
        ></div>

        <div id="actions">

            <button
                id="testButton"
                type="button"
                title="Planname im Plankopf prüfen"
            >
                <span id="testIcon">✓</span>

                <span id="testButtonText">
                    Plantester
                </span>
            </button>

            <button
                id="chooseButton"
                type="button"
            >
                PDF auswählen
            </button>

            <button
                id="closeButton"
                type="button"
                title="PDF schliessen"
                aria-label="PDF schliessen"
            >
                ×
            </button>

            <input
                id="fileInput"
                type="file"
                accept="application/pdf,.pdf"
            >

        </div>

    </header>

    <main>

        <div id="dropzone">

            <div id="message">

                <strong>
                    PDF-Plan hier hineinziehen
                </strong>

                <br>

                oder oben auf „PDF auswählen“ klicken

            </div>

            <canvas id="pdfCanvas"></canvas>

        </div>

    </main>

    <div id="status"></div>

    <canvas id="ocrCanvas"></canvas>

    <script type="module">

        import * as pdfjsLib from
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

        const dropzone =
            document.getElementById("dropzone");

        const message =
            document.getElementById("message");

        const pdfCanvas =
            document.getElementById("pdfCanvas");

        const pdfContext =
            pdfCanvas.getContext(
                "2d",
                {
                    willReadFrequently: true
                }
            );

        const ocrCanvas =
            document.getElementById("ocrCanvas");

        const ocrContext =
            ocrCanvas.getContext(
                "2d",
                {
                    willReadFrequently: true
                }
            );

        const chooseButton =
            document.getElementById("chooseButton");

        const testButton =
            document.getElementById("testButton");

        const closeButton =
            document.getElementById("closeButton");

        const fileInput =
            document.getElementById("fileInput");

        const planName =
            document.getElementById("planName");

        const status =
            document.getElementById("status");

        let pdfDocument = null;
        let firstPage = null;
        let renderedViewport = null;
        let statusTimer = null;

        chooseButton.addEventListener(
            "click",
            function () {
                fileInput.click();
            }
        );

        fileInput.addEventListener(
            "change",
            function () {
                if (fileInput.files.length > 0) {
                    loadPdf(
                        fileInput.files[0]
                    );
                }
            }
        );

        closeButton.addEventListener(
            "click",
            resetViewer
        );

        testButton.addEventListener(
            "click",
            testPlan
        );

        dropzone.addEventListener(
            "dragenter",
            handleDragOver
        );

        dropzone.addEventListener(
            "dragover",
            handleDragOver
        );

        dropzone.addEventListener(
            "dragleave",
            function (event) {
                event.preventDefault();

                dropzone.classList.remove(
                    "dragover"
                );
            }
        );

        dropzone.addEventListener(
            "drop",
            function (event) {
                event.preventDefault();

                dropzone.classList.remove(
                    "dragover"
                );

                const file =
                    event.dataTransfer.files[0];

                if (file) {
                    loadPdf(file);
                }
            }
        );

        function handleDragOver(event) {
            event.preventDefault();

            dropzone.classList.add(
                "dragover"
            );
        }

        function showStatus(
            text,
            type = ""
        ) {
            clearTimeout(statusTimer);

            status.textContent = text;

            status.className = type;

            status.style.display =
                "block";
        }

        function hideStatus() {
            clearTimeout(statusTimer);

            status.style.display =
                "none";

            status.className = "";
        }

        function hideStatusAfterDelay() {
            clearTimeout(statusTimer);

            statusTimer = setTimeout(
                function () {
                    hideStatus();
                },
                2500
            );
        }

        async function loadPdf(file) {

            const isPdf =
                file.type ===
                "application/pdf" ||
                file.name
                    .toLowerCase()
                    .endsWith(".pdf");

            if (!isPdf) {
                showStatus(
                    "Bitte eine PDF-Datei auswählen.",
                    "error"
                );

                hideStatusAfterDelay();

                return;
            }

            try {
                showStatus(
                    "PDF wird geladen ..."
                );

                const fileBuffer =
                    await file.arrayBuffer();

                const pdfData =
                    new Uint8Array(
                        fileBuffer
                    );

                pdfDocument =
                    await pdfjsLib
                        .getDocument({
                            data: pdfData
                        })
                        .promise;

                firstPage =
                    await pdfDocument.getPage(1);

                const originalViewport =
                    firstPage.getViewport({
                        scale: 1
                    });

                const availableWidth =
                    Math.max(
                        500,
                        dropzone.clientWidth - 30
                    );

                const availableHeight =
                    Math.max(
                        400,
                        dropzone.clientHeight - 30
                    );

                const fitScale =
                    Math.min(
                        availableWidth /
                        originalViewport.width,

                        availableHeight /
                        originalViewport.height
                    );

                const screenScale =
                    Math.max(
                        1,
                        window.devicePixelRatio
                    );

                const renderScale =
                    Math.max(
                        2,
                        fitScale * screenScale
                    );

                renderedViewport =
                    firstPage.getViewport({
                        scale: renderScale
                    });

                pdfCanvas.width =
                    Math.floor(
                        renderedViewport.width
                    );

                pdfCanvas.height =
                    Math.floor(
                        renderedViewport.height
                    );

                pdfCanvas.style.width =
                    Math.floor(
                        renderedViewport.width /
                        screenScale
                    ) + "px";

                pdfCanvas.style.height =
                    Math.floor(
                        renderedViewport.height /
                        screenScale
                    ) + "px";

                pdfContext.clearRect(
                    0,
                    0,
                    pdfCanvas.width,
                    pdfCanvas.height
                );

                await firstPage.render({
                    canvasContext:
                        pdfContext,

                    viewport:
                        renderedViewport
                }).promise;

                message.style.display =
                    "none";

                pdfCanvas.style.display =
                    "block";

                dropzone.classList.add(
                    "pdfLoaded"
                );

                chooseButton.style.display =
                    "none";

                testButton.style.display =
                    "flex";

                closeButton.style.display =
                    "flex";

                planName.textContent =
                    "";

                planName.title =
                    "";

                hideStatus();

            } catch (error) {
                console.error(error);

                showStatus(
                    "Die PDF konnte nicht geöffnet werden.",
                    "error"
                );

                hideStatusAfterDelay();
            }
        }

        async function testPlan() {

            if (
                !pdfDocument ||
                !firstPage
            ) {
                return;
            }

            testButton.disabled = true;

            planName.textContent = "";

            planName.title = "";

            try {
                showStatus(
                    "Planname wird gesucht ..."
                );

                /*
                    1. Versuch:
                    Den echten Text direkt aus
                    der PDF lesen.

                    Archicad-Pläne enthalten häufig
                    bereits lesbaren PDF-Text.
                */

                const directResult =
                    await readEmbeddedPdfText();

                if (directResult.name) {
                    displayPlanName(
                        directResult.name,
                        directResult.fullText
                    );

                    showStatus(
                        "Planname erkannt",
                        "success"
                    );

                    hideStatusAfterDelay();

                    return;
                }

                /*
                    2. Versuch:
                    Den Plankopf als Bild mit
                    OCR auslesen.
                */

                showStatus(
                    "Texterkennung wird geladen ..."
                );

                const ocrResult =
                    await readPlanTitleWithOcr();

                if (ocrResult.name) {
                    displayPlanName(
                        ocrResult.name,
                        ocrResult.fullText
                    );

                    showStatus(
                        "Planname erkannt",
                        "success"
                    );
                } else {
                    planName.textContent =
                        "Kein Planname erkannt";

                    planName.title =
                        "Im Plankopf wurde kein geeigneter Planname gefunden.";

                    showStatus(
                        "Kein Planname erkannt",
                        "error"
                    );
                }

                hideStatusAfterDelay();

            } catch (error) {
                console.error(
                    "Plantester-Fehler:",
                    error
                );

                planName.textContent =
                    "Erkennung nicht möglich";

                planName.title =
                    error.message || "";

                showStatus(
                    "Erkennung nicht möglich",
                    "error"
                );

                hideStatusAfterDelay();

            } finally {
                testButton.disabled =
                    false;
            }
        }

        async function readEmbeddedPdfText() {

            const textContent =
                await firstPage.getTextContent();

            const words = [];

            for (
                const item
                of textContent.items
            ) {
                const text =
                    cleanText(item.str);

                if (
                    !text ||
                    text.length < 2
                ) {
                    continue;
                }

                const transform =
                    pdfjsLib.Util.transform(
                        renderedViewport.transform,
                        item.transform
                    );

                words.push({
                    text: text,
                    x: transform[4],
                    y: transform[5]
                });
            }

            const allText =
                words
                    .map(
                        function (word) {
                            return word.text;
                        }
                    )
                    .join("\n");

            /*
                Zuerst wird auf der ganzen Seite gesucht.

                So wird der gewünschte Name auch erkannt,
                wenn der Text innerhalb des Plankopfs
                etwas weiter links oder oben steht.
            */

            const allLines =
                groupWordsIntoLines(words);

            let selectedName =
                selectBestPlanName(
                    allLines
                );

            /*
                Falls die ganze Seite kein Resultat ergibt,
                wird nochmals gezielt im unteren Bereich
                gesucht.
            */

            if (!selectedName) {
                const lowerWords =
                    words.filter(
                        function (word) {
                            return (
                                word.y >=
                                renderedViewport.height *
                                0.50
                            );
                        }
                    );

                const lowerLines =
                    groupWordsIntoLines(
                        lowerWords
                    );

                selectedName =
                    selectBestPlanName(
                        lowerLines
                    );
            }

            return {
                name: selectedName,
                fullText: allText
            };
        }

        function groupWordsIntoLines(words) {

            const sortedWords =
                [...words].sort(
                    function (a, b) {
                        const yDifference =
                            a.y - b.y;

                        if (
                            Math.abs(
                                yDifference
                            ) < 14
                        ) {
                            return a.x - b.x;
                        }

                        return yDifference;
                    }
                );

            const rows = [];

            for (
                const word
                of sortedWords
            ) {
                let matchingRow = null;

                for (
                    const row
                    of rows
                ) {
                    if (
                        Math.abs(
                            row.y - word.y
                        ) < 14
                    ) {
                        matchingRow = row;

                        break;
                    }
                }

                if (matchingRow) {
                    matchingRow.words.push(
                        word
                    );
                } else {
                    rows.push({
                        y: word.y,
                        words: [word]
                    });
                }
            }

            return rows
                .map(
                    function (row) {
                        row.words.sort(
                            function (a, b) {
                                return a.x - b.x;
                            }
                        );

                        return cleanText(
                            row.words
                                .map(
                                    function (word) {
                                        return word.text;
                                    }
                                )
                                .join(" ")
                        );
                    }
                )
                .filter(
                    function (line) {
                        return line.length >= 3;
                    }
                );
        }

        async function readPlanTitleWithOcr() {

            /*
                Dynamisches Laden verhindert,
                dass ein fehlerhaftes Script-Element
                die gesamte Seite blockiert.
            */

            const tesseractModule =
                await import(
                    "https://cdn.jsdelivr.net/npm/tesseract.js@5/+esm"
                );

            const recognize =
                tesseractModule.recognize ||
                (
                    tesseractModule.default &&
                    tesseractModule.default.recognize
                );

            if (
                typeof recognize !==
                "function"
            ) {
                throw new Error(
                    "Die Texterkennung konnte nicht geladen werden."
                );
            }

            /*
                Der untere Bereich umfasst 50 Prozent
                der Planhöhe und die gesamte Planbreite.

                Dadurch wird der vollständige Plankopf
                erfasst, auch wenn der gesuchte Text
                innerhalb des Plankopfs weiter links steht.
            */

            const sourceX = 0;

            const sourceY =
                Math.floor(
                    pdfCanvas.height *
                    0.50
                );

            const sourceWidth =
                pdfCanvas.width;

            const sourceHeight =
                pdfCanvas.height -
                sourceY;

            ocrCanvas.width =
                sourceWidth;

            ocrCanvas.height =
                sourceHeight;

            ocrContext.clearRect(
                0,
                0,
                sourceWidth,
                sourceHeight
            );

            ocrContext.fillStyle =
                "white";

            ocrContext.fillRect(
                0,
                0,
                sourceWidth,
                sourceHeight
            );

            ocrContext.drawImage(
                pdfCanvas,

                sourceX,
                sourceY,
                sourceWidth,
                sourceHeight,

                0,
                0,
                sourceWidth,
                sourceHeight
            );

            const result =
                await recognize(
                    ocrCanvas,
                    "deu+eng",
                    {
                        logger:
                            function (progress) {
                                if (
                                    progress.status ===
                                    "recognizing text"
                                ) {
                                    const percentage =
                                        Math.round(
                                            progress.progress *
                                            100
                                        );

                                    showStatus(
                                        "Plankopf wird gelesen: " +
                                        percentage +
                                        " %"
                                    );
                                }
                            }
                    }
                );

            const completeText =
                result.data.text || "";

            const lines =
                completeText
                    .split(/\r?\n/)
                    .map(cleanText)
                    .filter(
                        function (line) {
                            return (
                                line.length >= 3 &&
                                /[A-Za-zÄÖÜäöü0-9]/
                                    .test(line)
                            );
                        }
                    );

            return {
                name:
                    selectBestPlanName(
                        lines
                    ),

                fullText:
                    completeText
            };
        }

        function selectBestPlanName(lines) {

            if (
                !lines ||
                lines.length === 0
            ) {
                return "";
            }

            const ignoredLabels =
                /^(datum|massstab|maßstab|projekt|projektname|projektnummer|projekt nr|phase|format|gezeichnet|geprüft|revision|index|plannummer|plan nr|plannr|seite|bauherrschaft|bauherr|architekt|fachplaner|planverfasser|telefon|e-mail|email|adresse|legende|nord|bestand|neu|abbruch)\b/i;

            const ignoredText =
                /(weber partner|weberpart|logistik|räschle stiftung|helvetia|telefon|www\.|@|copyright)/i;

            const candidates =
                lines
                    .map(cleanText)
                    .filter(
                        function (line) {
                            return (
                                line.length >= 4 &&
                                !ignoredLabels.test(
                                    line
                                ) &&
                                !ignoredText.test(
                                    line
                                )
                            );
                        }
                    )
                    .map(
                        function (line) {
                            return {
                                text: line,
                                score:
                                    scorePlanName(
                                        line
                                    )
                            };
                        }
                    )
                    .filter(
                        function (candidate) {
                            return (
                                candidate.score >
                                15
                            );
                        }
                    );

            if (
                candidates.length === 0
            ) {
                return "";
            }

            candidates.sort(
                function (a, b) {
                    return (
                        b.score -
                        a.score
                    );
                }
            );

            return candidates[0]
                .text
                .slice(0, 140);
        }

        function scorePlanName(text) {

            let score = 0;

            score +=
                Math.min(
                    text.length,
                    50
                );

            /*
                Diese Begriffe sind bei Planbezeichnungen
                besonders wahrscheinlich.
            */

            if (
                /untergeschoss|erdgeschoss|obergeschoss|dachgeschoss|geschoss|grundriss|schnitt|ansicht|detail|fassade|deckenplan|bodenplan|umgebungsplan|bestandesplan|abbruchplan|bauetappe|etappe|mietfläche|mieterfläche/i
                    .test(text)
            ) {
                score += 100;
            }

            if (
                /\b\d+\.\s*(untergeschoss|obergeschoss)\b/i
                    .test(text)
            ) {
                score += 80;
            }

            if (
                /\b(ug|eg|og|dg)\b/i
                    .test(text)
            ) {
                score += 35;
            }

            if (
                /feb|mär|april|mai|juni|juli|aug|sept|okt|nov|dez/i
                    .test(text)
            ) {
                score += 25;
            }

            if (
                /\d/.test(text)
            ) {
                score += 8;
            }

            if (
                text.length < 7
            ) {
                score -= 25;
            }

            if (
                text.length > 110
            ) {
                score -= 40;
            }

            if (
                /sanierung|umbau|neubau/i
                    .test(text)
            ) {
                score += 15;
            }

            return score;
        }

        function cleanText(text) {

            if (!text) {
                return "";
            }

            return text
                .replace(/\s+/g, " ")
                .replace(
                    /^[|,;:._\-]+/,
                    ""
                )
                .replace(
                    /[|,;:._\-]+$/,
                    ""
                )
                .trim();
        }

        function displayPlanName(
            detectedName,
            completeText
        ) {
            const finalName =
                cleanText(
                    detectedName
                );

            planName.textContent =
                finalName;

            planName.title =
                completeText ||
                finalName;
        }

        function resetViewer() {

            clearTimeout(statusTimer);

            pdfDocument = null;
            firstPage = null;
            renderedViewport = null;

            pdfContext.clearRect(
                0,
                0,
                pdfCanvas.width,
                pdfCanvas.height
            );

            ocrContext.clearRect(
                0,
                0,
                ocrCanvas.width,
                ocrCanvas.height
            );

            pdfCanvas.width = 0;
            pdfCanvas.height = 0;

            ocrCanvas.width = 0;
            ocrCanvas.height = 0;

            pdfCanvas.style.display =
                "none";

            message.style.display =
                "block";

            dropzone.classList.remove(
                "pdfLoaded"
            );

            dropzone.classList.remove(
                "dragover"
            );

            chooseButton.style.display =
                "block";

            testButton.style.display =
                "none";

            testButton.disabled =
                false;

            closeButton.style.display =
                "none";

            planName.textContent =
                "";

            planName.title =
                "";

            fileInput.value =
                "";

            hideStatus();
